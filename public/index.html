<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07101f">
    <title>Linoctis</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="lino-window" class="lino-window" aria-label="Linoctis Lino machine">
      <canvas id="game" width="400" height="300" tabindex="0" aria-label="Lino-rendered integrated GUI"></canvas>
      <button id="fullscreen" class="fullscreen" type="button" title="Full screen, Escape exits" aria-label="Enter full screen">&#x26F6;</button>
      <button id="exit-fullscreen" class="exit-fullscreen" type="button" hidden>Exit full screen</button>
      <p id="status" class="status">Loading the real Lino iGUI sources...</p>
    </main>
    <noscript>Linoctis needs JavaScript to compile and run L.in.oleum source.</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
