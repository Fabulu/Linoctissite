<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07101f">
    <title>Linoctis</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="lino-window" class="lino-window" aria-label="Linoctis Lino machine">
      <section id="game-stage" class="game-stage">
        <canvas id="game" width="400" height="300" tabindex="0" aria-label="Lino-rendered Noctis"></canvas>
        <canvas id="fullscreen-game" width="320" height="200" tabindex="0" hidden aria-label="Fullscreen Noctis game view"></canvas>
        <button id="exit-fullscreen" class="exit-fullscreen" type="button" hidden title="Exit full screen (Ctrl+Shift+F)">Exit full screen</button>
      </section>
      <p id="status" class="status">Loading the real Lino Noctis sources...</p>
      <section id="crash-panel" class="crash-panel" hidden aria-live="assertive">
        <div><strong>Lino stopped unexpectedly.</strong> <button id="copy-crash" type="button">Copy crash report</button></div>
        <pre id="crash-report"></pre>
      </section>
    </main>
    <noscript>Linoctis needs JavaScript to compile and run L.in.oleum source.</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
