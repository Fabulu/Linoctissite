<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07101f">
    <title>Linoctis</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="lino-window" class="lino-window" aria-label="Linoctis game window">
      <header class="titlebar">
        <div class="app-mark" aria-hidden="true">L</div>
        <div class="caption">
          <strong>Linoctis</strong>
          <span>Browser flight deck</span>
        </div>
        <div class="window-buttons">
          <button id="fullscreen" class="chrome-button" type="button" title="Full screen, Escape exits" aria-label="Enter full screen">&#x26F6;</button>
        </div>
      </header>
      <nav class="menubar" aria-label="Game menu">
        <button id="game-menu" type="button" aria-expanded="false">GAME</button>
        <div id="menu-panel" class="menu-panel" hidden>
          <strong>Controls</strong>
          <span>Move: WASD or arrows</span>
          <span>Full screen: title-bar button</span>
          <span>Exit full screen: Escape or the visible Exit button</span>
        </div>
        <span class="runtime-badge">LinoJava AOT</span>
      </nav>
      <section class="viewport-shell">
        <canvas id="game" width="320" height="200" aria-label="Playable LinoJava runtime scene"></canvas>
        <button id="exit-fullscreen" class="exit-fullscreen" type="button" hidden>Exit full screen</button>
        <div class="scanline" aria-hidden="true"></div>
      </section>
      <footer class="statusbar">
        <span id="status">Compiling the flight deck...</span>
        <span id="coordinates">X 158 / Y 95</span>
      </footer>
    </main>
    <noscript>Linoctis needs JavaScript to run the compiled L.in.oleum programme.</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
