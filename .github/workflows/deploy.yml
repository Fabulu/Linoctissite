name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Linoctis
        uses: actions/checkout@v4

      - name: Checkout pinned LinoJava
        uses: actions/checkout@v4
        with:
          repository: Fabulu/linojava
          ref: eb8e816c3084df5e6cfd49ee6afcb9bb279ca4f5
          path: vendor/linojava

      - name: Checkout pinned Noctis Lino sources
        uses: actions/checkout@v4
        with:
          repository: Fabulu/noctis-lino
          ref: f35fb8317fd4f5e5c1c2876bae56978a81548bbe
          path: vendor/linoleum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and test
        env:
          LINOJAVA_DIR: vendor/linojava
          LINO_SOURCE_DIR: vendor/linoleum
        run: npm run build && npm test

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=linoctis --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Cloudflare deployment is locally managed
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Build is green. Add the standard Cloudflare repository secrets to enable push deployment."
