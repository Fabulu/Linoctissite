name: Browser VHGUI service A/B

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Profile interval in seconds
        required: true
        default: "20"
        type: choice
        options:
          - "5"
          - "20"

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROFILE_DURATION: ${{ inputs.duration || '20' }}
      LINOJAVA_FALLBACK_REVISION: db0c0c7004e10a90576da0e5e2f6af75d89e7e5c
      LINOJAVA_SERVICE_REVISION: fc3ff3292f57ae8477095c9edf2b91a44d905f5b
      LINO_SOURCE_REVISION: 92ddf9abe501c704bf2bb29858bda0f5444aa09b
    steps:
      - name: Checkout Linoctis
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout fallback LinoJava
        uses: actions/checkout@v4
        with:
          repository: Fabulu/linojava
          ref: ${{ env.LINOJAVA_FALLBACK_REVISION }}
          path: vendor/linojava-fallback

      - name: Checkout service LinoJava
        uses: actions/checkout@v4
        with:
          repository: Fabulu/linojava
          ref: ${{ env.LINOJAVA_SERVICE_REVISION }}
          path: vendor/linojava-service

      - name: Checkout pinned Noctis Lino sources
        uses: actions/checkout@v4
        with:
          repository: Fabulu/noctis-lino
          ref: ${{ env.LINO_SOURCE_REVISION }}
          path: vendor/linoleum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify exact service candidate
        env:
          LINOJAVA_DIR: vendor/linojava-service
          LINO_SOURCE_DIR: vendor/linoleum
        run: |
          npm run build
          git diff --exit-code -- public/noctis-runners.js public/linojava
          node --test test/site.test.js

      - name: Run interleaved fallback and service screen
        shell: bash
        run: |
          mkdir -p build/vhgui-service-screen
          variants=(fallback service service fallback service fallback fallback service)
          for index in "${!variants[@]}"; do
            variant="${variants[$index]}"
            run="$((index + 1))"
            if [[ "$variant" == "fallback" ]]; then
              linojava_dir=vendor/linojava-fallback
              linojava_revision="$LINOJAVA_FALLBACK_REVISION"
            else
              linojava_dir=vendor/linojava-service
              linojava_revision="$LINOJAVA_SERVICE_REVISION"
            fi
            LINOJAVA_DIR="$linojava_dir" LINO_SOURCE_DIR=vendor/linoleum npm run build
            node tools/profile-browser.mjs \
              --checkpoint test/fixtures/stardrifter-panel-v18.bin \
              --duration "$PROFILE_DURATION" \
              --presentation 60 \
              --worker-budget 10000 \
              --linojava-root "$linojava_dir" \
              --linoleum-root vendor/linoleum \
              --linojava-revision "$linojava_revision" \
              --linoleum-revision "$LINO_SOURCE_REVISION" \
              --site-revision "$GITHUB_SHA" \
              --output "build/vhgui-service-screen/${run}-${variant}.json"
          done
          LINOJAVA_DIR=vendor/linojava-service LINO_SOURCE_DIR=vendor/linoleum npm run build
          git diff --exit-code -- public/noctis-runners.js public/linojava

      - name: Summarize and qualify service result
        shell: bash
        run: |
          mkdir -p build/vhgui-service-screen/normalized
          for report in build/vhgui-service-screen/[1-8]-*.json; do
            label="$(basename "$report" .json)"
            variant="${label#*-}"
            jq --arg variant "$variant" '. + {screenVariant: $variant}' "$report" \
              > "build/vhgui-service-screen/normalized/${label}.json"
          done
          jq -s '
            def mean(field): map(field) | add / length;
            def spread_percent(field):
              (mean(field)) as $mean |
              if $mean == 0 then 0 else ((map(field) | max) - (map(field) | min)) / $mean * 100 end;
            . as $runs |
            ($runs | group_by(.screenVariant) | map({
              variant: .[0].screenVariant,
              runs: length,
              runtimeIds: map(.provenance.runtimeId) | unique,
              runnerSha256: map(.provenance.staticRunner.sha256) | unique,
              producedPresentationHz: mean(.metrics.producedPresentationHz),
              simulationHz: mean(.metrics.simulationHz),
              runnerMillisecondsPerFrame: mean(.metrics.averageRunnerMillisecondsPerProducedFrame),
              instructionsPerFrame: mean(.metrics.instructionsPerProducedFrame),
              controlSpreadPercent: spread_percent(.metrics.producedPresentationHz)
            })) as $arms |
            ($arms[] | select(.variant == "fallback")) as $fallback |
            ($arms[] | select(.variant == "service")) as $service |
            {
              schema: 2,
              qualification: "same-host shared-runner A/B; relative deltas qualify only",
              runs: $runs | map({
                variant: .screenVariant,
                runtimeId: .provenance.runtimeId,
                runnerSha256: .provenance.staticRunner.sha256,
                producedPresentationHz: .metrics.producedPresentationHz,
                simulationHz: .metrics.simulationHz,
                runnerMillisecondsPerFrame: .metrics.averageRunnerMillisecondsPerProducedFrame,
                instructionsPerFrame: .metrics.instructionsPerProducedFrame,
                menuOpenMilliseconds: .interaction.menuOpenMilliseconds,
                menuDismissMilliseconds: .interaction.menuDismissMilliseconds,
                activeElement: .interaction.activeElement,
                failures
              }),
              arms: $arms,
              delta: {
                producedPresentationHz: ($service.producedPresentationHz - $fallback.producedPresentationHz),
                runnerMillisecondsPerFrame: ($service.runnerMillisecondsPerFrame - $fallback.runnerMillisecondsPerFrame),
                instructionsPerFrame: ($service.instructionsPerFrame - $fallback.instructionsPerFrame)
              },
              passed: (
                ($runs | all(
                  .failures == {consoleErrors: [], failedRequests: [], pageErrors: []}
                  and .interaction.activeElement == "game"
                  and .provenance.workerBudget == 10000
                ))
                and ($arms | all(.runs == 4 and (.runtimeIds | length) == 1 and (.runnerSha256 | length) == 1))
                and ($arms | all(.controlSpreadPercent <= 5))
                and ($service.instructionsPerFrame <= $fallback.instructionsPerFrame - 650000)
                and ($service.runnerMillisecondsPerFrame < $fallback.runnerMillisecondsPerFrame)
                and ($service.producedPresentationHz > $fallback.producedPresentationHz)
              )
            }
          ' build/vhgui-service-screen/normalized/*.json \
            > build/vhgui-service-screen/summary.json
          {
            echo "## VHGUI service A/B"
            echo
            echo "Same-host shared-runner comparison; absolute FPS is not release evidence."
            echo
            echo "| Arm | Mean produced Hz | Mean simulation Hz | Runner ms/frame | Instructions/frame | Control spread |"
            echo "| :-- | ---: | ---: | ---: | ---: | ---: |"
            jq -r '.arms[] | [
              .variant,
              .producedPresentationHz,
              .simulationHz,
              .runnerMillisecondsPerFrame,
              .instructionsPerFrame,
              .controlSpreadPercent
            ] | @tsv' build/vhgui-service-screen/summary.json |
              while IFS=$'\t' read -r variant produced simulation runner instructions spread; do
                printf '| %s | %.3f | %.3f | %.3f | %.0f | %.2f%% |\n' \
                  "$variant" "$produced" "$simulation" "$runner" "$instructions" "$spread"
              done
            echo
            jq -r '"Qualified: **\(.passed)**; service delta: \(.delta.producedPresentationHz) produced Hz, \(.delta.runnerMillisecondsPerFrame) runner ms/frame, \(.delta.instructionsPerFrame) instructions/frame."' \
              build/vhgui-service-screen/summary.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e '.passed' build/vhgui-service-screen/summary.json

      - name: Upload service reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-vhgui-service-screen-${{ github.sha }}
          path: build/vhgui-service-screen/
          if-no-files-found: error
          retention-days: 14
